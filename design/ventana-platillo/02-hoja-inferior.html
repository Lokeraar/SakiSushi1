<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · Hoja inferior</title>
<style>
  :root{
    --papel:#FBF7F2; --superficie:#FFFFFF; --superficie-2:#F6F0E9;
    --text-primary:#2A1C14; --text-secondary:#5F4E44; --text-muted:#7A6A60;
    --primary:#A01828; --primary-text:#96121F;
    --accent:#DD951F; --accent-text:#8A5A00;
    --linea:#E8DDD3; --borde-control:#947F6D;
    --velo:rgba(65,45,30,.08);
    --sombra:0 -8px 28px rgba(65,45,30,.16);
  }
  html.oscuro{
    --papel:#12121c; --superficie:#1a1a2e; --superficie-2:#11111c;
    --text-primary:#ffffff; --text-secondary:#ced4da; --text-muted:#adb5bd;
    --primary:#D32F2F; --primary-text:#FF8A80;
    --accent:#FF9800; --accent-text:#FFB74D;
    --linea:rgba(255,255,255,.1); --borde-control:rgba(255,255,255,.3);
    --velo:rgba(255,255,255,.07);
    --sombra:0 -8px 28px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,var(--superficie-2),var(--papel));
    color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column;
    transition:background .2s,color .2s;
  }
  .barra{
    padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;
    font-size:.8rem;color:var(--text-muted);
  }
  .barra button{
    font:inherit;font-size:.8rem;padding:.4rem .8rem;border-radius:20px;
    border:1px solid var(--borde-control);background:transparent;color:var(--text-primary);
    cursor:pointer;min-height:36px;
  }
  .barra button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* La carta se ve detrás, difuminada: la hoja es un panel que sube. */
  .fondo-carta{flex:1;padding:0 1rem;opacity:.35;pointer-events:none}
  .fantasma{height:70px;border-radius:12px;background:var(--superficie);margin-bottom:.6rem;border:1px solid var(--linea)}

  .hoja{
    background:var(--superficie);border-radius:22px 22px 0 0;
    box-shadow:var(--sombra);border-top:1px solid var(--linea);
    max-height:74vh;display:flex;flex-direction:column;
  }
  .agarre{width:44px;height:5px;border-radius:3px;background:var(--linea);margin:.7rem auto .4rem}

  .cabecera{display:flex;align-items:flex-start;gap:.8rem;padding:.4rem 1rem .7rem}
  .miniatura{
    width:64px;height:64px;border-radius:12px;flex-shrink:0;cursor:zoom-in;
    background:
      radial-gradient(circle at 62% 42%,#f0a05a 0 22%,transparent 23%),
      radial-gradient(circle at 30% 55%,#c8442c 0 18%,transparent 19%),
      linear-gradient(140deg,#2b1a12,#0d0805);
    border:1px solid var(--linea);
  }
  .cabecera h1{font-size:1.05rem;line-height:1.25}
  .cabecera .desc{font-size:.78rem;color:var(--text-secondary);margin-top:.15rem}
  .precio{font-size:1.1rem;font-weight:700;color:var(--primary-text);margin-top:.3rem;display:block}
  .cerrar{
    margin-left:auto;width:34px;height:34px;border:none;background:transparent;
    color:var(--text-primary);font-size:1.35rem;cursor:pointer;border-radius:50%;flex-shrink:0;
  }
  .cerrar:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .scroll{overflow-y:auto;padding:0 1rem .6rem;display:flex;flex-direction:column;gap:.85rem}

  .fila{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
  .etiqueta{font-size:.85rem;color:var(--text-secondary)}
  .stock{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--text-secondary)}
  .punto{width:7px;height:7px;border-radius:50%;background:#2F6B3A}

  .stepper{display:flex;align-items:center;gap:.7rem}
  .stepper button{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--borde-control);
    background:transparent;color:var(--text-primary);font-size:1rem;cursor:pointer;
  }
  .stepper button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .stepper output{font-size:1.05rem;font-weight:700;min-width:2ch;text-align:center}

  /* Segmentado en una sola fila: ocupa poco alto vertical, que es lo escaso
     en una hoja inferior. */
  .segmentado{display:flex;background:var(--velo);border-radius:12px;padding:3px;gap:3px}
  .segmentado button{
    flex:1;min-height:40px;border:none;border-radius:9px;background:transparent;
    color:var(--text-secondary);font:inherit;font-size:.83rem;font-weight:600;cursor:pointer;
  }
  .segmentado button[aria-pressed="true"]{background:var(--superficie);color:var(--primary-text);box-shadow:0 1px 4px rgba(65,45,30,.12)}
  .segmentado button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .ing{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--linea)}
  .ing:last-child{border-bottom:none}
  .ing .mini{width:30px;height:30px;border-radius:7px;flex-shrink:0;background:linear-gradient(140deg,#e8c9a0,#b98a55);border:1px solid var(--linea)}
  .ing .nombre{flex:1;min-width:0;font-size:.84rem}
  .ing .cant{font-size:.7rem;color:var(--text-muted);display:block}
  .ing .ctrl{display:flex;align-items:center;gap:.25rem}
  .ing .ctrl button{
    width:28px;height:28px;border-radius:50%;border:1px solid var(--borde-control);
    background:transparent;color:var(--text-primary);cursor:pointer;font-size:.85rem;
  }
  .ing .ctrl .estado{width:48px;text-align:center;font-size:.7rem;font-weight:600}
  .ing .ctrl button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .acciones{
    display:flex;gap:.6rem;padding:.8rem 1rem 1.1rem;
    border-top:1px solid var(--linea);background:var(--superficie);
  }
  .btn{flex:1;min-height:46px;border-radius:50px;border:none;font:inherit;font-weight:600;font-size:.92rem;cursor:pointer}
  .btn.secundario{background:transparent;border:1px solid var(--borde-control);color:var(--text-primary)}
  .btn.principal{background:var(--primary);color:#fff}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="barra">
    <span>02 · Hoja inferior</span>
    <button type="button" id="tema">Cambiar tema</button>
  </div>

  <div class="fondo-carta" aria-hidden="true">
    <div class="fantasma"></div><div class="fantasma"></div><div class="fantasma"></div>
  </div>

  <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="titulo02">
    <div class="agarre" aria-hidden="true"></div>

    <div class="cabecera">
      <div class="miniatura" role="button" tabindex="0" aria-label="Ampliar la foto"></div>
      <div style="flex:1;min-width:0">
        <h1 id="titulo02">Nigiri de Atún (2 pcs)</h1>
        <p class="desc">2 piezas de atún sobre arroz</p>
        <span class="precio">Bs. 5.816,79</span>
      </div>
      <button class="cerrar" type="button" aria-label="Cerrar">&times;</button>
    </div>

    <div class="scroll">
      <div class="fila">
        <span class="stock"><span class="punto"></span> 414 disponibles</span>
        <div class="stepper">
          <button type="button" aria-label="Quitar una unidad">&minus;</button>
          <output>1</output>
          <button type="button" aria-label="Agregar una unidad">+</button>
        </div>
      </div>

      <div class="segmentado" role="group" aria-label="Cómo quieres el plato">
        <button type="button" aria-pressed="true">Completo</button>
        <button type="button" aria-pressed="false">Personalizar</button>
      </div>

      <div>
        <div class="ing">
          <span class="mini"></span>
          <span class="nombre">Arroz para sushi <small class="cant">0,15 kg · fijo</small></span>
          <span class="ctrl">
            <button type="button" aria-label="Quitar arroz">&minus;</button>
            <span class="estado">Normal</span>
            <button type="button" aria-label="Duplicar arroz">&times;2</button>
          </span>
        </div>
        <div class="ing">
          <span class="mini"></span>
          <span class="nombre">Atún fresco <small class="cant">0,1 kg · fijo</small></span>
          <span class="ctrl">
            <button type="button" aria-label="Quitar atún">&minus;</button>
            <span class="estado">Normal</span>
            <button type="button" aria-label="Duplicar atún">&times;2</button>
          </span>
        </div>
      </div>
    </div>

    <div class="acciones">
      <button class="btn secundario" type="button">Cancelar</button>
      <button class="btn principal" type="button">Añadir</button>
    </div>
  </div>

<script>
  document.getElementById('tema').addEventListener('click', function () {
    document.documentElement.classList.toggle('oscuro');
  });
</script>
</body>
</html>
