<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 · Pasos</title>
<style>
  :root{
    --papel:#FBF7F2; --superficie:#FFFFFF; --superficie-2:#F6F0E9;
    --text-primary:#2A1C14; --text-secondary:#5F4E44; --text-muted:#7A6A60;
    --primary:#A01828; --primary-text:#96121F;
    --accent:#DD951F; --accent-text:#8A5A00;
    --linea:#E8DDD3; --borde-control:#947F6D;
    --velo:rgba(65,45,30,.05);
    --sombra:0 8px 24px rgba(65,45,30,.12);
  }
  html.oscuro{
    --papel:#12121c; --superficie:#1a1a2e; --superficie-2:#0e0e18;
    --text-primary:#ffffff; --text-secondary:#ced4da; --text-muted:#adb5bd;
    --primary:#D32F2F; --primary-text:#FF8A80;
    --accent:#FF9800; --accent-text:#FFB74D;
    --linea:rgba(255,255,255,.1); --borde-control:rgba(255,255,255,.3);
    --velo:rgba(255,255,255,.05);
    --sombra:0 8px 24px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,var(--papel),var(--superficie-2));
    color:var(--text-primary);min-height:100vh;padding:1rem;
    display:flex;flex-direction:column;align-items:center;gap:.75rem;
    transition:background .2s,color .2s;
  }
  .barra{width:100%;max-width:390px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--text-muted)}
  .barra button{
    font:inherit;font-size:.8rem;padding:.4rem .8rem;border-radius:20px;
    border:1px solid var(--borde-control);background:transparent;color:var(--text-primary);
    cursor:pointer;min-height:36px;
  }
  .barra button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .ventana{
    width:100%;max-width:390px;background:var(--superficie);
    border:1px solid var(--linea);border-radius:20px;overflow:hidden;box-shadow:var(--sombra);
    display:flex;flex-direction:column;
  }

  /* Cabecera compacta: la foto se va al costado del nombre, muy chica.
     El peso visual lo llevan los ingredientes, que es donde el cliente
     decide. */
  .cabecera{display:flex;gap:.75rem;padding:.85rem 1rem;align-items:center;border-bottom:1px solid var(--linea)}
  .miniatura{
    width:56px;height:56px;border-radius:12px;flex-shrink:0;cursor:zoom-in;
    background:
      radial-gradient(circle at 62% 42%,#f0a05a 0 22%,transparent 23%),
      radial-gradient(circle at 30% 55%,#c8442c 0 18%,transparent 19%),
      linear-gradient(140deg,#2b1a12,#0d0805);
    border:1px solid var(--linea);
  }
  .cabecera h1{font-size:1rem;line-height:1.2}
  .cabecera .precio{font-size:.92rem;font-weight:700;color:var(--primary-text);margin-top:.15rem;display:block}
  .cerrar{
    margin-left:auto;width:34px;height:34px;border:none;background:transparent;
    color:var(--text-primary);font-size:1.3rem;cursor:pointer;border-radius:50%;flex-shrink:0;
  }
  .cerrar:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* Indicador de pasos: dice en cuál estás y cuántos quedan. */
  .pasos{display:flex;align-items:center;gap:.4rem;padding:.7rem 1rem 0;font-size:.72rem;color:var(--text-muted)}
  .paso{display:flex;align-items:center;gap:.35rem}
  .paso .num{
    width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--borde-control);font-size:.68rem;font-weight:700;
  }
  .paso[data-actual="true"] .num{background:var(--primary);border-color:var(--primary);color:#fff}
  .paso[data-actual="true"]{color:var(--text-primary);font-weight:600}
  .guion{flex:1;height:1px;background:var(--linea)}

  .cuerpo{padding:1rem;display:flex;flex-direction:column;gap:.85rem;flex:1}
  .pregunta{font-size:1.02rem;font-weight:600}
  .pista{font-size:.8rem;color:var(--text-secondary);margin-top:.15rem}

  .fila{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
  .etiqueta{font-size:.85rem;color:var(--text-secondary)}
  .stock{display:inline-flex;align-items:center;gap:.35rem;font-size:.76rem;color:var(--text-secondary)}
  .punto{width:7px;height:7px;border-radius:50%;background:#2F6B3A}

  .stepper{display:flex;align-items:center;gap:.7rem}
  .stepper button{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--borde-control);
    background:transparent;color:var(--text-primary);font-size:1.05rem;cursor:pointer;
  }
  .stepper button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .stepper output{font-size:1.15rem;font-weight:700;min-width:2ch;text-align:center}

  .lista{display:flex;flex-direction:column;gap:.5rem}
  .ing{
    display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;
    border:1px solid var(--linea);border-radius:12px;
  }
  .ing .mini{width:32px;height:32px;border-radius:8px;flex-shrink:0;background:linear-gradient(140deg,#e8c9a0,#b98a55);border:1px solid var(--linea)}
  .ing .nombre{flex:1;min-width:0;font-size:.86rem}
  .ing .cant{font-size:.71rem;color:var(--text-muted);display:block}
  .ing .ctrl{display:flex;align-items:center;gap:.25rem}
  .ing .ctrl button{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--borde-control);
    background:transparent;color:var(--text-primary);cursor:pointer;font-size:.88rem;
  }
  .ing .ctrl .estado{width:48px;text-align:center;font-size:.71rem;font-weight:600}
  .ing .ctrl button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .acciones{display:flex;gap:.6rem;padding:0 1rem 1rem}
  .btn{flex:1;min-height:46px;border-radius:50px;border:none;font:inherit;font-weight:600;font-size:.92rem;cursor:pointer}
  .btn.secundario{background:transparent;border:1px solid var(--borde-control);color:var(--text-primary)}
  .btn.principal{background:var(--primary);color:#fff}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="barra">
    <span>05 · Pasos</span>
    <button type="button" id="tema">Cambiar tema</button>
  </div>

  <div class="ventana" role="dialog" aria-modal="true" aria-labelledby="titulo05">
    <div class="cabecera">
      <div class="miniatura" role="button" tabindex="0" aria-label="Ampliar la foto"></div>
      <div style="flex:1;min-width:0">
        <h1 id="titulo05">Nigiri de Atún (2 pcs)</h1>
        <span class="precio">Bs. 5.816,79</span>
      </div>
      <button class="cerrar" type="button" aria-label="Cerrar">&times;</button>
    </div>

    <div class="pasos" aria-label="Paso 2 de 2">
      <span class="paso"><span class="num">1</span> Cantidad</span>
      <span class="guion"></span>
      <span class="paso" data-actual="true"><span class="num">2</span> Ingredientes</span>
    </div>

    <div class="cuerpo">
      <div>
        <p class="pregunta">¿Cómo lo quieres?</p>
        <p class="pista">Quita lo que no te guste o pide doble de lo que más te guste.</p>
      </div>

      <div class="fila">
        <span class="stock"><span class="punto"></span> 414 disponibles</span>
        <div class="stepper">
          <button type="button" aria-label="Quitar una unidad">&minus;</button>
          <output>1</output>
          <button type="button" aria-label="Agregar una unidad">+</button>
        </div>
      </div>

      <div class="lista">
        <div class="ing">
          <span class="mini"></span>
          <span class="nombre">Arroz para sushi <small class="cant">0,15 kg · define el plato</small></span>
          <span class="ctrl">
            <button type="button" aria-label="Quitar arroz">&minus;</button>
            <span class="estado">Normal</span>
            <button type="button" aria-label="Duplicar arroz">&times;2</button>
          </span>
        </div>
        <div class="ing">
          <span class="mini"></span>
          <span class="nombre">Atún fresco <small class="cant">0,1 kg · define el plato</small></span>
          <span class="ctrl">
            <button type="button" aria-label="Quitar atún">&minus;</button>
            <span class="estado">Normal</span>
            <button type="button" aria-label="Duplicar atún">&times;2</button>
          </span>
        </div>
      </div>
    </div>

    <div class="acciones">
      <button class="btn secundario" type="button">Atrás</button>
      <button class="btn principal" type="button">Añadir · Bs. 5.816,79</button>
    </div>
  </div>

<script>
  document.getElementById('tema').addEventListener('click', function () {
    document.documentElement.classList.toggle('oscuro');
  });
</script>
</body>
</html>
