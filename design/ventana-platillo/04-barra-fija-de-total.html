<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 · Barra fija de total</title>
<style>
  :root{
    --papel:#FBF7F2; --superficie:#FFFFFF; --superficie-2:#F6F0E9;
    --text-primary:#2A1C14; --text-secondary:#5F4E44; --text-muted:#7A6A60;
    --primary:#A01828; --primary-text:#96121F;
    --accent:#DD951F; --accent-text:#8A5A00;
    --linea:#E8DDD3; --borde-control:#947F6D;
    --velo:rgba(65,45,30,.05);
    --sombra:0 6px 26px rgba(65,45,30,.13);
  }
  html.oscuro{
    --papel:#12121c; --superficie:#1a1a2e; --superficie-2:#0e0e18;
    --text-primary:#ffffff; --text-secondary:#ced4da; --text-muted:#adb5bd;
    --primary:#D32F2F; --primary-text:#FF8A80;
    --accent:#FF9800; --accent-text:#FFB74D;
    --linea:rgba(255,255,255,.1); --borde-control:rgba(255,255,255,.3);
    --velo:rgba(255,255,255,.05);
    --sombra:0 6px 26px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,var(--papel),var(--superficie-2));
    color:var(--text-primary);min-height:100vh;padding:1rem 1rem 6rem;
    display:flex;flex-direction:column;align-items:center;gap:.75rem;
    transition:background .2s,color .2s;
  }
  .barra{width:100%;max-width:390px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--text-muted)}
  .barra button{
    font:inherit;font-size:.8rem;padding:.4rem .8rem;border-radius:20px;
    border:1px solid var(--borde-control);background:transparent;color:var(--text-primary);
    cursor:pointer;min-height:36px;
  }
  .barra button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .ventana{
    width:100%;max-width:390px;background:var(--superficie);
    border:1px solid var(--linea);border-radius:20px;overflow:hidden;box-shadow:var(--sombra);
  }
  .foto{position:relative;height:150px;cursor:zoom-in;
    background:
      radial-gradient(circle at 62% 42%,#f0a05a 0 22%,transparent 23%),
      radial-gradient(circle at 30% 55%,#c8442c 0 18%,transparent 19%),
      linear-gradient(140deg,#2b1a12,#0d0805);
  }
  .cerrar{
    position:absolute;top:.6rem;right:.6rem;width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;border:none;border-radius:50%;
    background:var(--superficie);color:var(--text-primary);font-size:1.35rem;line-height:1;
    cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .cerrar:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .cuerpo{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.85rem}
  h1{font-size:1.15rem;line-height:1.25}
  .desc{font-size:.84rem;color:var(--text-secondary);line-height:1.4}
  .stock{display:inline-flex;align-items:center;gap:.35rem;font-size:.76rem;color:var(--text-secondary)}
  .punto{width:7px;height:7px;border-radius:50%;background:#2F6B3A}

  /* Aquí NO hay botones de acción dentro del cuerpo: viven en la barra
     inferior fija. Así el total y el botón Añadir nunca se pierden al
     desplazar la lista de ingredientes. */
  .fila{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
  .etiqueta{font-size:.85rem;color:var(--text-secondary)}
  .stepper{display:flex;align-items:center;gap:.7rem}
  .stepper button{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--borde-control);
    background:transparent;color:var(--text-primary);font-size:1rem;cursor:pointer;
  }
  .stepper button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .stepper output{font-size:1.05rem;font-weight:700;min-width:2ch;text-align:center}

  .switch{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.7rem .8rem;border:1px solid var(--linea);border-radius:12px}
  .switch span{font-size:.87rem}
  .switch small{display:block;color:var(--text-secondary);font-size:.74rem;margin-top:.1rem}
  .pista{width:44px;height:26px;border-radius:20px;background:var(--borde-control);position:relative;flex-shrink:0;border:none;cursor:pointer}
  .pista[aria-pressed="true"]{background:var(--primary)}
  .pista::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s}
  .pista[aria-pressed="true"]::after{left:21px}
  .pista:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .ing{display:flex;align-items:center;gap:.55rem;padding:.5rem 0;border-bottom:1px solid var(--linea)}
  .ing:last-child{border-bottom:none}
  .ing .mini{width:30px;height:30px;border-radius:7px;flex-shrink:0;background:linear-gradient(140deg,#e8c9a0,#b98a55);border:1px solid var(--linea)}
  .ing .nombre{flex:1;min-width:0;font-size:.83rem}
  .ing .cant{font-size:.7rem;color:var(--text-muted);display:block}
  .ing .ctrl{display:flex;align-items:center;gap:.25rem}
  .ing .ctrl button{
    width:28px;height:28px;border-radius:50%;border:1px solid var(--borde-control);
    background:transparent;color:var(--text-primary);cursor:pointer;font-size:.85rem;
  }
  .ing .ctrl .estado{width:46px;text-align:center;font-size:.7rem;font-weight:600}
  .ing .ctrl button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* Barra de total, pegada abajo del todo de la pantalla. */
  .barra-total{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;align-items:center;gap:1rem;
    padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom));
    background:var(--superficie);border-top:1px solid var(--linea);
    box-shadow:0 -6px 20px rgba(65,45,30,.12);
  }
  html.oscuro .barra-total{box-shadow:0 -6px 20px rgba(0,0,0,.5)}
  .barra-total .bloque-total{flex:1;min-width:0}
  .barra-total .rotulo{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
  .barra-total .cifra{font-size:1.25rem;font-weight:700;color:var(--primary-text);line-height:1.15}
  .btn{
    min-height:46px;padding:0 1.4rem;border-radius:50px;border:none;font:inherit;
    font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap;
  }
  .btn.principal{background:var(--primary);color:#fff}
  .btn.secundario{background:transparent;border:1px solid var(--borde-control);color:var(--text-primary)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="barra">
    <span>04 · Barra fija de total</span>
    <button type="button" id="tema">Cambiar tema</button>
  </div>

  <div class="ventana" role="dialog" aria-modal="true" aria-labelledby="titulo04">
    <div class="foto" role="button" tabindex="0" aria-label="Ampliar la foto del Nigiri de Atún">
      <button class="cerrar" type="button" aria-label="Cerrar">&times;</button>
    </div>

    <div class="cuerpo">
      <div>
        <h1 id="titulo04">Nigiri de Atún (2 pcs)</h1>
        <p class="desc">2 piezas de atún sobre arroz. Pescado fresco del día.</p>
      </div>

      <span class="stock"><span class="punto"></span> 414 disponibles</span>

      <div class="fila">
        <span class="etiqueta">Cantidad</span>
        <div class="stepper">
          <button type="button" aria-label="Quitar una unidad">&minus;</button>
          <output>1</output>
          <button type="button" aria-label="Agregar una unidad">+</button>
        </div>
      </div>

      <div class="switch">
        <span>Personalizar ingredientes<small>Al activarlo se muestra la lista</small></span>
        <button class="pista" type="button" role="switch" aria-checked="false" aria-pressed="false" aria-label="Personalizar ingredientes"></button>
      </div>

      <div>
        <div class="ing">
          <span class="mini"></span>
          <span class="nombre">Arroz para sushi <small class="cant">0,15 kg · fijo</small></span>
          <span class="ctrl">
            <button type="button" aria-label="Quitar arroz">&minus;</button>
            <span class="estado">Normal</span>
            <button type="button" aria-label="Duplicar arroz">&times;2</button>
          </span>
        </div>
        <div class="ing">
          <span class="mini"></span>
          <span class="nombre">Atún fresco <small class="cant">0,1 kg · fijo</small></span>
          <span class="ctrl">
            <button type="button" aria-label="Quitar atún">&minus;</button>
            <span class="estado">Normal</span>
            <button type="button" aria-label="Duplicar atún">&times;2</button>
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="barra-total">
    <div class="bloque-total">
      <div class="rotulo">Total</div>
      <div class="cifra">Bs. 5.816,79</div>
    </div>
    <button class="btn secundario" type="button">Cancelar</button>
    <button class="btn principal" type="button">Añadir</button>
  </div>

<script>
  document.getElementById('tema').addEventListener('click', function () {
    document.documentElement.classList.toggle('oscuro');
  });
  document.querySelector('.pista').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') === 'true';
    this.setAttribute('aria-pressed', String(!on));
    this.setAttribute('aria-checked', String(!on));
  });
</script>
</body>
</html>
