<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 · Foto al frente</title>
<style>
  :root{
    --papel:#FBF7F2; --superficie:#FFFFFF; --superficie-2:#F6F0E9;
    --text-primary:#2A1C14; --text-secondary:#5F4E44; --text-muted:#7A6A60;
    --primary:#A01828; --primary-text:#96121F;
    --accent:#DD951F; --accent-text:#8A5A00;
    --linea:#E8DDD3; --borde-control:#947F6D;
    --velo-agotado:rgba(65,45,30,.08); --tinta-agotado:#5F4E44;
    --sombra:0 8px 24px rgba(65,45,30,.12);
  }
  html.oscuro{
    --papel:#12121c; --superficie:rgba(255,255,255,.05); --superficie-2:#1a1a2e;
    --text-primary:#ffffff; --text-secondary:#ced4da; --text-muted:#adb5bd;
    --primary:#D32F2F; --primary-text:#FF8A80;
    --accent:#FF9800; --accent-text:#FFB74D;
    --linea:rgba(255,255,255,.1); --borde-control:rgba(255,255,255,.3);
    --velo-agotado:rgba(255,255,255,.14); --tinta-agotado:rgba(255,255,255,.78);
    --sombra:0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,var(--papel),var(--superficie-2));
    color:var(--text-primary);min-height:100vh;padding:1rem;
    display:flex;flex-direction:column;align-items:center;gap:.75rem;
    transition:background .2s,color .2s;
  }
  .barra{width:100%;max-width:390px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--text-muted)}
  .barra button{
    font:inherit;font-size:.8rem;padding:.4rem .8rem;border-radius:20px;
    border:1px solid var(--borde-control);background:transparent;color:var(--text-primary);
    cursor:pointer;min-height:36px;
  }
  .barra button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .ventana{
    width:100%;max-width:390px;background:var(--superficie);
    border:1px solid var(--linea);border-radius:20px;overflow:hidden;box-shadow:var(--sombra);
  }
  .foto{
    position:relative;height:210px;
    background:
      radial-gradient(circle at 62% 42%,#f0a05a 0 22%,transparent 23%),
      radial-gradient(circle at 30% 55%,#c8442c 0 18%,transparent 19%),
      linear-gradient(140deg,#2b1a12,#0d0805);
    cursor:zoom-in;
  }
  .foto::after{
    content:"Toca para ampliar";position:absolute;right:.7rem;bottom:.7rem;
    background:rgba(0,0,0,.62);color:#fff;font-size:.7rem;padding:.25rem .6rem;border-radius:20px;
  }
  .cerrar{
    position:absolute;top:.7rem;right:.7rem;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    border:none;border-radius:50%;cursor:pointer;
    background:var(--superficie);color:var(--text-primary);
    font-size:1.4rem;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .cerrar:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .cuerpo{padding:1.1rem;display:flex;flex-direction:column;gap:.9rem}
  h1{font-size:1.25rem;line-height:1.25}
  .desc{font-size:.88rem;color:var(--text-secondary);line-height:1.45}
  .fila{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
  .precio{font-size:1.35rem;font-weight:700;color:var(--primary-text)}

  .stock{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;color:var(--text-secondary)}
  .punto{width:8px;height:8px;border-radius:50%;background:#2F6B3A}

  .stepper{display:flex;align-items:center;gap:.9rem}
  .stepper button{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--borde-control);
    background:transparent;color:var(--text-primary);font-size:1.1rem;cursor:pointer;
  }
  .stepper button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .stepper output{font-size:1.2rem;font-weight:700;min-width:2ch;text-align:center}

  .modos{display:flex;flex-direction:column;gap:.5rem}
  .modo{
    display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;
    border:1px solid var(--linea);border-radius:12px;cursor:pointer;background:transparent;
    color:var(--text-primary);text-align:left;width:100%;font:inherit;
  }
  .modo[aria-pressed="true"]{border-color:var(--primary);background:var(--velo-agotado)}
  .modo:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .modo .marca{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--borde-control);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#fff;
  }
  .modo[aria-pressed="true"] .marca{background:var(--primary);border-color:var(--primary)}
  .modo small{display:block;color:var(--text-secondary);font-size:.76rem;margin-top:.1rem}

  .ingredientes{display:flex;flex-direction:column;gap:.1rem}
  .ing{
    display:flex;align-items:center;gap:.6rem;padding:.55rem 0;
    border-bottom:1px solid var(--linea);
  }
  .ing:last-child{border-bottom:none}
  .ing .mini{
    width:34px;height:34px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(140deg,#e8c9a0,#b98a55);border:1px solid var(--linea);
  }
  .ing .nombre{flex:1;min-width:0;font-size:.88rem}
  .ing .cant{font-size:.72rem;color:var(--text-muted);display:block}
  .ing .ctrl{display:flex;align-items:center;gap:.3rem}
  .ing .ctrl button{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--borde-control);
    background:transparent;color:var(--text-primary);cursor:pointer;font-size:.9rem;
  }
  .ing .ctrl .estado{width:52px;text-align:center;font-size:.74rem;font-weight:600;color:var(--text-primary)}
  .ing .ctrl button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .acciones{display:flex;gap:.6rem;padding:0 1.1rem 1.1rem}
  .btn{
    flex:1;min-height:46px;border-radius:50px;border:none;font:inherit;
    font-weight:600;font-size:.92rem;cursor:pointer;
  }
  .btn.secundario{background:transparent;border:1px solid var(--borde-control);color:var(--text-primary)}
  .btn.principal{background:var(--primary);color:#fff}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="barra">
    <span>01 · Foto al frente</span>
    <button type="button" id="tema">Cambiar tema</button>
  </div>

  <div class="ventana" role="dialog" aria-modal="true" aria-labelledby="titulo01">
    <div class="foto" role="button" tabindex="0" aria-label="Ampliar la foto del Nigiri de Atún">
      <button class="cerrar" type="button" aria-label="Cerrar">&times;</button>
    </div>

    <div class="cuerpo">
      <div>
        <h1 id="titulo01">Nigiri de Atún (2 pcs)</h1>
        <p class="desc">2 piezas de atún sobre arroz. Pescado fresco del día.</p>
      </div>

      <div class="fila">
        <span class="stock"><span class="punto"></span> 414 disponibles</span>
        <span class="precio">Bs. 5.816,79</span>
      </div>

      <div class="fila">
        <span style="font-size:.9rem;color:var(--text-secondary)">Cantidad</span>
        <div class="stepper">
          <button type="button" aria-label="Quitar una unidad">&minus;</button>
          <output>1</output>
          <button type="button" aria-label="Agregar una unidad">+</button>
        </div>
      </div>

      <div class="modos" role="group" aria-label="Cómo quieres el plato">
        <button class="modo" type="button" aria-pressed="true">
          <span class="marca">✓</span>
          <span>Completo<small>Incluye todos los ingredientes</small></span>
        </button>
        <button class="modo" type="button" aria-pressed="false">
          <span class="marca"></span>
          <span>Personalizar ingredientes<small>Quitar alguno, o pedir extra</small></span>
        </button>
      </div>

      <div class="ingredientes">
        <div class="ing">
          <span class="mini"></span>
          <span class="nombre">Arroz para sushi <small class="cant">0,15 kg · fijo</small></span>
          <span class="ctrl">
            <button type="button" aria-label="Quitar arroz">&minus;</button>
            <span class="estado">Normal</span>
            <button type="button" aria-label="Duplicar arroz">&times;2</button>
          </span>
        </div>
        <div class="ing">
          <span class="mini"></span>
          <span class="nombre">Atún fresco <small class="cant">0,1 kg · fijo</small></span>
          <span class="ctrl">
            <button type="button" aria-label="Quitar atún">&minus;</button>
            <span class="estado">Normal</span>
            <button type="button" aria-label="Duplicar atún">&times;2</button>
          </span>
        </div>
      </div>
    </div>

    <div class="acciones">
      <button class="btn secundario" type="button">Cancelar</button>
      <button class="btn principal" type="button">Añadir</button>
    </div>
  </div>

<script>
  document.getElementById('tema').addEventListener('click', function () {
    document.documentElement.classList.toggle('oscuro');
  });
</script>
</body>
</html>
