# SDD Configuration for SakiSushi0
# Generated by sdd-init executor

project:
  name: "SakiSushi0"
  type: "vanilla-js-supabase"
  description: "Sushi restaurant ordering system with Cliente (customer), Admin (management), and Cajero (POS) panels"
  root: "E:/Documents/SakiSushi0"
  repo_url: "https://github.com/lokeraar/SakiSushi0"
  deployed_urls:
    cliente: "https://lokeraar.github.io/SakiSushi0/Cliente/"
    cajero: "https://lokeraar.github.io/SakiSushi0/Cajero/"
    admin: "https://lokeraar.github.io/SakiSushi0/admin/"

stack:
  frontend:
    language: "javascript"
    framework: "none"  # Vanilla JS with IIFE modules
    module_pattern: "IIFE with window.Saki namespace + window.* fallbacks"
    panels:
      - name: "Cliente"
        path: "Cliente/"
        entry: "index.html"
        modules: 16
        js_dir: "js/"
      - name: "Cajero"
        path: "Cajero/"
        entry: "index.html"
        structure: "monolithic inline JS"
      - name: "Admin"
        path: "admin/"
        entry: "index.html"
        modules: 13
        js_dir: "js/"
  backend:
    platform: "supabase"
    database: "postgresql"
    auth: "supabase-auth (ECC P-256 JWT via shadow users)"
    realtime: true
    storage: true
    edge_functions:
      - "login"
      - "send-push"
      - "enviar-email-recuperacion"
      - "tasa-bcv-scraper"
  deployment: "github-pages"

testing:
  runner: "playwright"
  status: "not-configured"  # Playwright tests mentioned but not in repo
  test_dir: "tests/"  # To be created
  browsers: ["chromium", "firefox", "webkit"]
  base_url: "https://lokeraar.github.io/SakiSushi0/Cliente/"
  notes: "Bugs found in Playwright testing of Cliente app need to be fixed via SDD"

sdd:
  strict_tdd: true
  phase_rules:
    proposal:
      require_questions_round: true
      min_questions: 3
      max_questions: 5
    spec:
      require_executable_specs: true
      format: "gherkin"  # Given/When/Then for Playwright
    design:
      require_architecture_decision_log: true
    tasks:
      max_task_size: "single test case"
      require_test_first: true
    apply:
      commit_per_task: true
      chained_pr_threshold: 400
    verify:
      run_all_tests: true
      require_trace: true
      judgement_day: true          # Siempre usar judgement-day en verify
      judgement_day_model: "minimax-m3-free"  # Modelo para judgement-day
      judgement_day_effort: "xhigh"            # Effort level para judgement-day
  
  # Configuración de modelos y effort por fase SDD
  models:
    sdd-init:
      model: "nemotron-3-ultra-free"
      effort: "medium"
    sdd-onboard:
      model: "nemotron-3-ultra-free"
      effort: "medium"
    sdd-proposal:
      model: "minimax-m3-free"
      effort: "xhigh"
    sdd-explore:
      model: "minimax-m3-free"
      effort: "xhigh"
    sdd-spec:
      model: "minimax-m3-free"
      effort: "high"
    sdd-design:
      model: "mimo-v2.5-free"
      effort: "high"
    sdd-tasks:
      model: "big-pickle"
      effort: "medium"
    sdd-apply:
      model: "minimax-m3-free"
      effort: "xhigh"
    sdd-verify:
      model: "deepseek-v4-flash-free"   # Modelo principal (existente)
      effort: "xhigh"
      judgement_day: true
      judgement_day_model: "minimax-m3-free"  # Modelo adicional para judgement-day
      judgement_day_effort: "xhigh"
    sdd-sync:
      model: "mimo-v2.5-free"
      effort: "medium"
    sdd-archive:
      model: "big-pickle"
      effort: "low"
  artifact_store: "openspec"
  memory:
    enabled: true
    topic_prefix: "sdd/"

paths:
  config: "openspec/config.yaml"
  proposals: "openspec/changes/"
  specs: "openspec/specs/"
  designs: "openspec/designs/"
  tasks: "openspec/tasks/"
  verify_reports: "openspec/verify/"
  skill_registry: ".atl/skill-registry.md"

skills:
  project:
    - "playwright"
    - "branch-pr"
    - "chained-pr"
    - "work-unit-commits"
    - "judgment-day"
    - "issue-creation"
    - "comment-writer"
    - "cognitive-doc-design"
  user:
    - "atomic-design"
    - "react"
    - "go-testing"
    - "image-analysis"
    - "ui-ux"
    - "skill-creator"
    - "skill-improver"

conventions:
  naming:
    modules: "cliente-*.js, admin-*.js"
    namespaces: "window.Saki.modules.*"
    fallbacks: "window.* for onclick handlers"
  git:
    main_branch: "main"
    commit_prefix: "fix:|feat:|refactor:|test:"
  supabase:
    rpc_naming: "snake_case"
    table_naming: "snake_case"
    column_naming: "snake_case"

# Current change context (will be updated per change)
current_change: null