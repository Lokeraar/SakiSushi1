<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 155" width="140" height="155">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="70" cy="77.5" r="65" fill="url(#redGradient)" />
  
  <!-- Sushi emoji-style graphic -->
  <g transform="translate(70, 77.5)">
    <!-- Rice -->
    <ellipse cx="0" cy="-5" rx="25" ry="12" fill="#FFFFFF" />
    <ellipse cx="-18" cy="-5" rx="10" ry="6" fill="#FFFFFF" opacity="0.9" />
    <ellipse cx="18" cy="-5" rx="10" ry="6" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Fish topping -->
    <path d="M-15,-15 Q0,-25 15,-15 Q10,-10 0,-5 Q-10,-10 -15,-15" fill="#E65100" />
    <path d="M-12,-15 Q0,-22 12,-15 Q8,-11 0,-6 Q-8,-11 -12,-15" fill="#FF9800" opacity="0.7" />
    
    <!-- Seaweed strip -->
    <rect x="-20" y="2" width="40" height="4" rx="1" fill="#1B5E20" />
    
    <!-- Text "SAKI" -->
    <text x="0" y="40" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="2">SAKI</text>
    <text x="0" y="58" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="10" font-weight="500" fill="#FFE0B2">SUSHI</text>
  </g>
</svg>